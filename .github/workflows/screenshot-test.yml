# -----------------------------------------------------------------------------
# screenshot-test.yml
#
# Triggered by the Chrome extension via a `repository_dispatch` API call with
# event_type "cross-os-test" and a client_payload of
# { target_url, run_tag, full_page }.
#
# For each OS in the matrix, a real GitHub-hosted runner opens `target_url`
# in a pinned Playwright/Chromium version (see package.json), saves a
# screenshot (full-page or viewport-only, per full_page), then commits it to
# the `results` branch under results/<run_tag>/<os>-<browser>.png — which
# the extension polls for via the GitHub Contents API.
# -----------------------------------------------------------------------------

name: Cross-OS Screenshot Test

on:
  repository_dispatch:
    types: [cross-os-test]

jobs:
  screenshot:
    # Without this, GITHUB_TOKEN defaults to read-only on many repos and the
    # git push step below fails with a permission error identical to the
    # one we hit manually with an under-scoped PAT earlier.
    permissions:
      contents: write

    strategy:
      # Each OS runs independently and in parallel — one failing OS doesn't
      # block the others from finishing and being committed.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Playwright + Chromium only
        # npm ci installs the exact pinned version from package-lock.json —
        # not "whatever's latest today" — so a run in January and a run in
        # June use the identical Chromium build. For a tool whose entire
        # point is comparing renders, an unpinned engine would let "the
        # tool changed" masquerade as "the site changed."
        run: |
          npm ci
          npx playwright install chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}
        shell: bash

      - name: Capture screenshot
        run: node scripts/capture.js
        shell: bash
        env:
          TARGET_URL: ${{ github.event.client_payload.target_url }}
          FULL_PAGE: ${{ github.event.client_payload.full_page }}
          OUTPUT_PATH: screenshot-output.png

      - name: Checkout results branch
        uses: actions/checkout@v4
        with:
          ref: results
          path: results-branch
          # Shallow is enough — this job only ever adds one new commit on
          # top of the current tip, never reads old history. Fetching
          # everything here would make this checkout keep getting slower
          # as the results branch accumulates months of screenshots.
          fetch-depth: 1

      - name: Commit screenshot to results branch
        shell: bash
        # RUN_TAG comes in via `env:`, not `${{ }}` interpolated straight into
        # this script. repository_dispatch payloads are attacker-influenceable
        # if a token ever leaks (as very nearly happened earlier), so any
        # event data touching a shell script goes through an env var, never
        # directly into the run: block — GitHub's own security guidance calls
        # out the direct-interpolation pattern as a script-injection risk.
        env:
          RUN_TAG: ${{ github.event.client_payload.run_tag }}
        run: |
          OS_LABEL="${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'macos' || 'linux' }}"
          DEST_DIR="results-branch/results/${RUN_TAG}"
          DEST_FILE="${DEST_DIR}/${OS_LABEL}-chromium.png"

          mkdir -p "${DEST_DIR}"
          cp screenshot-output.png "${DEST_FILE}"

          cd results-branch
          git config user.name "cross-os-tester-bot"
          git config user.email "actions@github.com"
          git add "results/${RUN_TAG}/${OS_LABEL}-chromium.png"
          git commit -m "Add ${OS_LABEL} screenshot for ${RUN_TAG}"

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin results && git push origin results && break
            sleep 5
          done
