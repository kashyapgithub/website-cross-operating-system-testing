# -----------------------------------------------------------------------------
# screenshot-test.yml
#
# Triggered by the Chrome extension via a `repository_dispatch` API call with
# event_type "cross-os-test" and a client_payload of
# { target_url, run_tag, full_page }.
#
# For each OS in the matrix, a real GitHub-hosted runner opens `target_url`
# in a pinned Playwright/Chromium version (see package.json), saves a
# screenshot (full-page or viewport-only, per full_page), then commits it to
# the `results` branch under results/<run_tag>/<os>-<browser>.png — which
# the extension polls for via the GitHub Contents API.
# -----------------------------------------------------------------------------

name: Cross-OS Screenshot Test

on:
  repository_dispatch:
    types: [cross-os-test]

jobs:
  screenshot:
    # Without this, GITHUB_TOKEN defaults to read-only on many repos and the
    # git push step below fails with a permission error identical to the
    # one we hit manually with an under-scoped PAT earlier.
    permissions:
      contents: write

    strategy:
      # Each OS runs independently and in parallel — one failing OS doesn't
      # block the others from finishing and being committed.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Playwright and requested browsers
        env:
          BROWSERS: ${{ github.event.client_payload.browsers }}
        run: |
          npm ci
          IFS=',' read -r -a BROWSERS_ARR <<< "${BROWSERS:-chromium,firefox,webkit}"
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps "${BROWSERS_ARR[@]}"
          else
            npx playwright install "${BROWSERS_ARR[@]}"
          fi
        shell: bash

      - name: Checkout results branch
        uses: actions/checkout@v4
        with:
          ref: results
          path: results-branch
          fetch-depth: 1

      - name: Capture screenshots and commit to results branch
        shell: bash
        env:
          TARGET_URL: ${{ github.event.client_payload.target_url }}
          FULL_PAGE: ${{ github.event.client_payload.full_page }}
          RUN_TAG: ${{ github.event.client_payload.run_tag }}
          BROWSERS: ${{ github.event.client_payload.browsers }}
        run: |
          case "$RUNNER_OS" in
            Windows) OS_LABEL="windows" ;;
            macOS)   OS_LABEL="macos" ;;
            *)       OS_LABEL="linux" ;;
          esac

          DEST_DIR="results-branch/results/${RUN_TAG}"
          mkdir -p "${DEST_DIR}"

          cd results-branch || exit 1
          git config user.name "cross-os-tester-bot"
          git config user.email "actions@github.com"
          cd .. || exit 1

          IFS=',' read -r -a BROWSER_LIST <<< "${BROWSERS:-chromium,firefox,webkit}"
          for browser in "${BROWSER_LIST[@]}"; do
            browser=$(echo "$browser" | tr -d '[:space:]')
            if [ -z "$browser" ]; then continue; fi

            echo "Capturing $browser on $OS_LABEL..."
            OUTPUT_FILE="screenshot-${OS_LABEL}-${browser}.png"
            BROWSER="$browser" OUTPUT_PATH="$OUTPUT_FILE" node scripts/capture.js

            cp "$OUTPUT_FILE" "${DEST_DIR}/${OS_LABEL}-${browser}.png"

            cd results-branch || exit 1
            git add "results/${RUN_TAG}/${OS_LABEL}-${browser}.png"
            git commit -m "Add ${OS_LABEL}-${browser} screenshot for ${RUN_TAG}"

            for attempt in 1 2 3 4 5; do
              git pull --rebase origin results && git push origin results && break
              sleep 5
            done
            cd .. || exit 1
          done
